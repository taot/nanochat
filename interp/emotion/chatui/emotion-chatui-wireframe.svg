<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .panel { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1.2; }
      .panel-soft { fill: #f9fbff; stroke: #dbe3ee; stroke-width: 1.2; }
      .ink { fill: #122033; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #6b778c; font-family: Inter, Arial, sans-serif; }
      .mono { fill: #69758a; font-family: JetBrains Mono, Consolas, monospace; }
      .title { font-size: 24px; font-weight: 700; }
      .h1 { font-size: 18px; font-weight: 700; }
      .h2 { font-size: 14px; font-weight: 700; letter-spacing: .4px; }
      .body { font-size: 13px; }
      .small { font-size: 11px; }
      .tiny { font-size: 10px; }
      .button { fill: #122033; }
      .button-text { fill: #ffffff; font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .outline { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .chip { fill: #eef4ff; stroke: #c7d7f5; stroke-width: 1; }
      .amber { fill: #f4b740; }
      .blue { fill: #5b8def; }
      .red { fill: #f05f5f; }
      .teal { fill: #35b8a6; }
      .purple { fill: #8b6be8; }
      .track { fill: #e8edf5; }
      .line { stroke: #dbe3ee; stroke-width: 1.2; }
      .dash { stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 5 5; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>

  <rect class="panel" x="32" y="28" width="1536" height="944" rx="26" filter="url(#shadow)"/>
  <line class="line" x1="292" y1="28" x2="292" y2="972"/>
  <line class="line" x1="1188" y1="28" x2="1188" y2="972"/>

  <!-- Left rail -->
  <text class="ink title" x="58" y="72">Emotion Lab</text>
  <text class="muted body" x="58" y="98">Experiment console for reply steering</text>

  <rect class="panel-soft" x="56" y="124" width="204" height="134" rx="16"/>
  <text class="mono small" x="74" y="150">BACKEND</text>
  <circle class="teal" cx="78" cy="178" r="6"/>
  <text class="ink h1" x="92" y="184">nanochat</text>
  <text class="muted body" x="74" y="212">Detect: residual probes</text>
  <text class="muted body" x="74" y="236">Reply: activation steering</text>

  <rect class="panel-soft" x="56" y="282" width="204" height="166" rx="16"/>
  <text class="mono small" x="74" y="308">SESSION</text>
  <text class="ink body" x="74" y="338">Messages</text>
  <text class="mono body" x="214" y="338" text-anchor="end">4</text>
  <line class="line" x1="74" y1="352" x2="242" y2="352"/>
  <text class="ink body" x="74" y="380">Latest emotion</text>
  <text class="mono body" x="214" y="380" text-anchor="end">Happy</text>
  <line class="line" x1="74" y1="394" x2="242" y2="394"/>
  <text class="ink body" x="74" y="422">Reply target</text>
  <text class="mono body" x="214" y="422" text-anchor="end">Happy</text>

  <rect class="panel-soft" x="56" y="472" width="204" height="190" rx="16"/>
  <text class="mono small" x="74" y="498">STEERING SUMMARY</text>
  <rect class="chip" x="74" y="518" width="88" height="28" rx="14"/>
  <circle class="amber" cx="90" cy="532" r="6"/>
  <text class="ink body" x="104" y="537">Happy</text>
  <text class="muted body" x="74" y="578">Strength</text>
  <rect class="track" x="74" y="594" width="150" height="8" rx="4"/>
  <rect class="amber" x="74" y="594" width="83" height="8" rx="4"/>
  <circle class="ink" cx="157" cy="598" r="7"/>
  <text class="mono body" x="228" y="603" text-anchor="end">1.8</text>
  <text class="muted body" x="74" y="634">Positions: all layers tokens</text>

  <rect class="outline" x="56" y="894" width="204" height="44" rx="12"/>
  <text class="ink h2" x="158" y="922" text-anchor="middle">+ New chat</text>

  <!-- Center header -->
  <text class="ink h1" x="326" y="70">New session</text>
  <text class="muted body" x="326" y="96">4 turns · nanochat · reply Happy · strength 1.8 · temp 0.8</text>
  <rect class="chip" x="1010" y="54" width="132" height="34" rx="17"/>
  <text class="mono small" x="1076" y="76" text-anchor="middle">AUTO-DETECT ON</text>
  <line class="line" x1="292" y1="116" x2="1188" y2="116"/>

  <!-- Chat stream -->
  <rect class="panel-soft" x="326" y="152" width="500" height="110" rx="22"/>
  <text class="ink body" x="354" y="186">I just got great news today. Can you help me write a</text>
  <text class="ink body" x="354" y="210">short reply that sounds warm but not too excited?</text>
  <rect class="chip" x="666" y="278" width="160" height="28" rx="14"/>
  <circle class="amber" cx="684" cy="292" r="6"/>
  <text class="mono small" x="700" y="296">HAPPY · 72%</text>

  <circle class="ink" cx="346" cy="344" r="16"/>
  <text class="button-text" x="346" y="349" text-anchor="middle">A</text>
  <text class="ink h2" x="374" y="340">Assistant</text>
  <text class="mono small" x="374" y="362">REPLY · HAPPY · strength 1.8 · temp 0.8 · top-k 50</text>
  <rect class="panel" x="374" y="382" width="650" height="142" rx="22"/>
  <text class="ink body" x="402" y="418">That's wonderful news. Here's a warm, grounded reply:</text>
  <text class="ink body" x="402" y="450">"I'm really happy to hear that. This sounds like a meaningful</text>
  <text class="ink body" x="402" y="482">step, and I'm glad it worked out for you."</text>

  <rect class="panel-soft" x="522" y="580" width="500" height="96" rx="22"/>
  <text class="ink body" x="550" y="616">Can you make the next answer calmer and more reassuring?</text>
  <rect class="chip" x="862" y="692" width="160" height="28" rx="14"/>
  <circle class="teal" cx="880" cy="706" r="6"/>
  <text class="mono small" x="896" y="710">CALM · 61%</text>

  <!-- Composer -->
  <rect class="panel" x="326" y="760" width="826" height="178" rx="24"/>
  <text class="mono small" x="354" y="790">COMPOSER</text>
  <rect class="outline" x="354" y="806" width="770" height="52" rx="14"/>
  <text class="muted body" x="376" y="838">Type a message...</text>
  <rect class="outline" x="354" y="876" width="86" height="36" rx="10"/>
  <text class="ink h2" x="397" y="899" text-anchor="middle">Detect</text>
  <rect class="outline" x="454" y="876" width="146" height="36" rx="10"/>
  <text class="ink body" x="474" y="899">Reply: Happy</text>
  <text class="mono body" x="576" y="899">v</text>
  <text class="muted body" x="622" y="899">Strength</text>
  <rect class="track" x="696" y="891" width="160" height="8" rx="4"/>
  <rect class="amber" x="696" y="891" width="94" height="8" rx="4"/>
  <circle class="ink" cx="790" cy="895" r="7"/>
  <text class="mono body" x="866" y="900">1.8</text>
  <rect class="outline" x="912" y="876" width="118" height="36" rx="10"/>
  <text class="ink body" x="971" y="899" text-anchor="middle">Advanced</text>
  <rect class="button" x="1042" y="876" width="82" height="36" rx="10"/>
  <text class="button-text" x="1083" y="899" text-anchor="middle">Send</text>

  <line class="dash" x1="354" y1="925" x2="1124" y2="925"/>
  <text class="mono tiny" x="354" y="952">Advanced: Assistant prefix [He feels...] · Temp [0.8] · Top-k [50] · Max tokens [512] · Positions [all] · Confidence [x] · Distribution [x]</text>

  <!-- Right rail -->
  <text class="ink h1" x="1224" y="70">Emotion Analysis</text>
  <text class="muted body" x="1224" y="96">Separate detection from reply steering</text>

  <rect class="panel-soft" x="1224" y="124" width="306" height="168" rx="18"/>
  <text class="mono small" x="1244" y="152">LATEST DETECTION</text>
  <text class="ink title" x="1244" y="198">Happy</text>
  <text class="mono title" x="1498" y="198" text-anchor="end">72%</text>
  <rect class="track" x="1244" y="220" width="254" height="10" rx="5"/>
  <rect class="amber" x="1244" y="220" width="183" height="10" rx="5"/>
  <text class="muted body" x="1244" y="262">"I just got great news today..."</text>

  <rect class="panel-soft" x="1224" y="320" width="306" height="238" rx="18"/>
  <text class="mono small" x="1244" y="348">DISTRIBUTION</text>
  <text class="ink body" x="1244" y="386">Happy</text>
  <text class="mono body" x="1498" y="386" text-anchor="end">72%</text>
  <rect class="track" x="1244" y="396" width="254" height="10" rx="5"/>
  <rect class="amber" x="1244" y="396" width="183" height="10" rx="5"/>
  <text class="ink body" x="1244" y="430">Calm</text>
  <text class="mono body" x="1498" y="430" text-anchor="end">18%</text>
  <rect class="track" x="1244" y="440" width="254" height="10" rx="5"/>
  <rect class="teal" x="1244" y="440" width="46" height="10" rx="5"/>
  <text class="ink body" x="1244" y="474">Sad</text>
  <text class="mono body" x="1498" y="474" text-anchor="end">7%</text>
  <rect class="track" x="1244" y="484" width="254" height="10" rx="5"/>
  <rect class="blue" x="1244" y="484" width="18" height="10" rx="5"/>
  <text class="ink body" x="1244" y="518">Angry</text>
  <text class="mono body" x="1498" y="518" text-anchor="end">3%</text>
  <rect class="track" x="1244" y="528" width="254" height="10" rx="5"/>
  <rect class="red" x="1244" y="528" width="8" height="10" rx="5"/>

  <rect class="panel-soft" x="1224" y="586" width="306" height="246" rx="18"/>
  <text class="mono small" x="1244" y="614">REPLY STEERING</text>
  <text class="ink body" x="1244" y="650">Target emotion</text>
  <rect class="chip" x="1404" y="630" width="94" height="30" rx="15"/>
  <circle class="amber" cx="1420" cy="645" r="6"/>
  <text class="ink body" x="1434" y="650">Happy</text>
  <text class="ink body" x="1244" y="690">Strength</text>
  <text class="mono body" x="1498" y="690" text-anchor="end">1.8</text>
  <text class="ink body" x="1244" y="724">Positions</text>
  <text class="mono body" x="1498" y="724" text-anchor="end">all</text>
  <text class="ink body" x="1244" y="758">Temperature</text>
  <text class="mono body" x="1498" y="758" text-anchor="end">0.8</text>
  <text class="ink body" x="1244" y="792">Top-k / Max tokens</text>
  <text class="mono body" x="1498" y="792" text-anchor="end">50 / 512</text>

  <rect class="panel-soft" x="1224" y="860" width="306" height="78" rx="18"/>
  <text class="mono small" x="1244" y="888">NOTES</text>
  <text class="muted body" x="1244" y="916">UI exposes runtime controls;</text>
  <text class="muted body" x="1244" y="936">model/checkpoint remain CLI config.</text>
</svg>
